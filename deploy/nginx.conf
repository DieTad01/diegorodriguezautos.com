# /etc/nginx/sites-available/diegorodriguezautos.com
# Nginx recibe el tráfico del dominio y lo pasa a Node (puerto 3000).
# Certbot agrega después el bloque HTTPS (443) automáticamente.
# Las cabeceras de seguridad (CSP, nosniff, etc.) las pone Node (helmet).

# Máximo 10 intentos de login por minuto por IP (segunda capa además de la de Node)
limit_req_zone $binary_remote_addr zone=login_admin:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name diegorodriguezautos.com www.diegorodriguezautos.com;

    server_tokens off;
    client_max_body_size 100k;

    # Comprimir texto: páginas más ligeras y rápidas (Google mide la velocidad)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # Nunca servir archivos ocultos (.env, .git, ...) aunque algo falle en Node
    location ~ /\. {
        return 404;
    }

    location = /api/admin/login {
        limit_req zone=login_admin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location = /api/cliente/login {
        limit_req zone=login_admin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }
}
