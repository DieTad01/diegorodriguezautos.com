# /etc/nginx/sites-available/diegorodriguezautos.com
# Nginx recibe el tráfico del dominio y lo pasa a Node (puerto 3000).
# Certbot agrega después el bloque HTTPS (443) automáticamente.

server {
    listen 80;
    listen [::]:80;
    server_name diegorodriguezautos.com www.diegorodriguezautos.com;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Nunca servir archivos ocultos (.env, .git, ...) aunque algo falle en Node
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
